<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LO'PRIMO</title>
  <meta name="description" content="LO'PRIMO — Tenemos una sorpresa.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!--
    ============================================================
    PÁGINA "MUY PRONTO" (coming soon)
    Esta página es independiente: no usa assets/style.css ni ningún
    otro archivo, solo images/logo.png.

    PARA PUBLICAR EL SITIO COMPLETO (cuando el cliente dé el visto bueno):
      1. Borra este archivo (index.html).
      2. Renombra index-live.html  ->  index.html
      3. Sube todo el sitio. ¡Listo!

    FECHA DE LA CUENTA REGRESIVA: cámbiala abajo, en LAUNCH_DATE
    (formato AAAA-MM-DDTHH:MM:SS-04:00 — el -04:00 es hora de República Dominicana).
    ============================================================
  -->
  <style>
    :root{
      --sand:#F7F4EF; --sand-dim:#F0EBE2; --paper:#FFFFFF;
      --espresso:#2C221E; --espresso-soft:#6E5F55; --line:#DDD3C4;
      --amber:#DCA143; --olive:#3F5C33;
      --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body:'Inter', -apple-system, 'Segoe UI', sans-serif;
    }
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:32px 20px; text-align:center;
      background:
        radial-gradient(760px 320px at 88% -15%, rgba(63,92,51,.16), transparent 60%),
        radial-gradient(1100px 420px at 15% -10%, rgba(220,161,67,.18), transparent 60%),
        linear-gradient(180deg, var(--sand-dim), var(--sand));
      background-attachment:fixed;
      color:var(--espresso);
      font-family:var(--font-body);
    }
    .logo{ width:min(420px, 78vw); height:auto; display:block; margin:0 auto 6px; }
    h1{
      font-family:var(--font-display); font-weight:600;
      font-size:clamp(1.7rem, 4.6vw, 2.8rem); line-height:1.15;
      margin:0 0 10px;
    }
    h1 em{ font-style:normal; color:var(--olive); }
    .sub{ margin:0 0 36px; color:var(--espresso-soft); font-size:1.02rem; }
    .sub-foot{ margin:0 0 36px; color:var(--espresso-soft); font-size:0.90rem; }
    .countdown{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .unit{
      background:var(--paper); border:1px solid var(--line); border-radius:6px;
      min-width:96px; padding:16px 10px 12px;
      box-shadow:0 12px 30px rgba(44,34,30,.10);
    }
    .num{
      display:block; font-family:var(--font-display); font-weight:700;
      font-size:clamp(1.9rem, 6vw, 2.8rem); line-height:1; color:var(--olive);
      font-variant-numeric:tabular-nums;
    }
    .label{
      display:block; margin-top:8px; font-size:.72rem; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase; color:var(--espresso-soft);
    }
    .done{ display:none; font-family:var(--font-display); font-size:1.4rem; color:var(--olive); }
    .foot{ margin-top:44px; font-size:.82rem; color:var(--espresso-soft); }
    @media (max-width:480px){
      .countdown{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; max-width:380px; }
      .unit{ min-width:0; padding:12px 2px 10px; }
      .label{ font-size:.58rem; letter-spacing:.03em; }
    }
  </style>
</head>
<body>
  <img class="logo" src="images/logo.png" alt="LO'PRIMO">

  <h1>Primos... Tenemos una <em>sorpresa</em> para ustedes.</h1>
  <p class="sub">Pendientes.</p>

  <div class="countdown" id="countdown" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="cdDays">--</span><span class="label">Días</span></div>
    <div class="unit"><span class="num" id="cdHours">--</span><span class="label">Horas</span></div>
    <div class="unit"><span class="num" id="cdMins">--</span><span class="label">Minutos</span></div>
    <div class="unit"><span class="num" id="cdSecs">--</span><span class="label">Segundos</span></div>
  </div>
  <div class="done" id="cdDone">¡Ya casi! Vuelve en unos minutos.</div>

  <div class="foot">LO&#8217;PRIMO</div>
  <p class="sub-foot">Pop dominicano desde 2013</p>

  <script>
    /* >>> CAMBIA AQUÍ LA FECHA DE LANZAMIENTO <<< */
    var LAUNCH_DATE = '2026-10-06T19:00:00-04:00';

    (function () {
      var target = new Date(LAUNCH_DATE).getTime();
      var box = document.getElementById('countdown');
      var done = document.getElementById('cdDone');
      var d = document.getElementById('cdDays'), h = document.getElementById('cdHours'),
          m = document.getElementById('cdMins'), s = document.getElementById('cdSecs');
      function pad(n) { return n < 10 ? '0' + n : String(n); }
      function tick() {
        var diff = target - Date.now();
        if (isNaN(diff) || diff <= 0) {
          box.style.display = 'none'; done.style.display = 'block';
          return false;
        }
        var secs = Math.floor(diff / 1000);
        d.textContent = Math.floor(secs / 86400);
        h.textContent = pad(Math.floor(secs % 86400 / 3600));
        m.textContent = pad(Math.floor(secs % 3600 / 60));
        s.textContent = pad(secs % 60);
        return true;
      }
      if (tick()) {
        var timer = setInterval(function () { if (!tick()) clearInterval(timer); }, 1000);
      }
    })();
  </script>
</body>
</html>
